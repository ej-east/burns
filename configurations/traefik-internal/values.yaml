ingressClass:
  enabled: true
  isDefaultClass: false
  name: internal

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: internal
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    labelSelector: "traefik-instance=internal"

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true

service:
  type: LoadBalancer
  spec:
    loadBalancerClass: tailscale
    allocateLoadBalancerNodePorts: false
  annotations:
    tailscale.com/hostname: k8s-internal
    tailscale.com/tags: "tag:k8s-internal"
