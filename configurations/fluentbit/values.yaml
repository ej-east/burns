# yaml-language-server: $schema=values.schema.json
kind: DaemonSet
logLevel: info
testFramework:
  enabled: false
serviceAccount:
  create: true
  name: fluentbit
rbac:
  create: true
  nodeAccess: false
  eventsAccess: false
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
env:
  - name: OS_USER
    valueFrom:
      secretKeyRef:
        name: opensearch-fluent-bit-writer
        key: username
  - name: OS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-fluent-bit-writer
        key: password
luaScripts:
  normalize.lua: |
    local syslog = { [0]="emerg", [1]="alert", [2]="crit", [3]="error", [4]="warning", [5]="notice", [6]="info", [7]="debug" }
    local marker = { I="info", W="warning", E="error", D="debug", F="fatal", T="trace"}

    function normalize(tag, ts, record)
      local lvl = record["level"]
      if lvl == nil then
        return 0, ts, record
      end

      if type(lvl) == "number" then
        local sev
        local m = record["message"]

        if type(m) == "string" then
          local c = string.match(m, "^%((%a)%)")
          if c then sev = marker[string.upper(c)] end
        end
        record["log_level"] = sev or syslog[lvl] or tostring(lvl)
      else
        record["log_level"] = string.lower(tostring(lvl))
      end
      record["level"] = nil
      return 2, ts, record
    end
config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf

        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

        storage.path  /var/log/flb-storage/
        storage.sync  normal
        storage.backlog.mem_limit 50M
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*fluentbit*,/var/log/containers/*fluent-bit*
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        DB                /var/log/flb_kube.db
        DB.locking        On
        storage.type      filesystem
        storage.pause_on_chunks_overlimit On
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Kube_Tag_Prefix     kube.var.log.containers.

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             $kubernetes['namespace_name'] ^(fluentbit)$

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             log_message ^\(I\) GET /health

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             event ^/-/health/

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             log grpc\.health\.v1\.Health

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             user_agent (kube-probe|healthcheck)

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude message     helm template \. --name-template

    [FILTER]
        Name                modify
        Match               kube.*
        Rename              log         message
        Rename              msg         message
        Rename              event       message
        Rename              log_message message
        Rename              host        url_domain
        Remove              time
        Remove              timestamp
        Remove              _p

    [FILTER]
        Name                lua
        Match               kube.*
        script              /fluent-bit/scripts/normalize.lua
        call                normalize
  outputs: |
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines
        storage.total_limit_size 5G
    [OUTPUT]
      Name opensearch
      Match kube.*
      Host burns.opensearch.svc.cluster.local
      Port 9200
      HTTP_USER ${OS_USER}
      HTTP_Passwd ${OS_PASSWORD}
      tls On
      tls.verify Off
      Index logs
      Suppress_Type_Name On
      Logstash_Format Off
      Retry_Limit  5
      storage.total_limit_size 5G
