# yaml-language-server: $schema=values.schema.json
kind: DaemonSet

logLevel: info

serviceAccount:
  create: true 
  name: fluentbit

rbac:
  create: true
  nodeAccess: false
  eventsAccess: false

resources:
  requests:
    cpu: 25m 
    memory: 64Mi 
  limits:
    cpu: 200m 
    memory: 256Mi 

config:
  service: | 
    [SERVICE]
        Daemon        Off
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf

        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines
