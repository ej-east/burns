apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale
      targetRevision: 1.98.9
      helm:
        valueFiles:
          - $values/configurations/tailscale/values.yaml
    - repoURL: https://github.com/ej-east/burns
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/ej-east/burns
      targetRevision: HEAD
      path: manifests/tailscale
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        external-secrets.elijah.fyi/onepassword: "enabled"
    automated:
      prune: true
      selfHeal: true
