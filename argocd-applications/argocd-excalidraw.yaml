apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: excalidraw
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/ej-east/burns
      targetRevision: HEAD
      path: manifests/excalidraw
  destination:
    server: "https://kubernetes.default.svc"
    namespace: excalidraw
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
        istio-injection: disabled
    automated:
      prune: true
      selfHeal: true
