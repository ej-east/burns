apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.20.1
    - repoURL: https://github.com/ej-east/burns
      targetRevision: HEAD
      path: manifests/cert-manager/elijah.fyi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        secrets.elijah.fyi/onepassword: "enabled"
    automated:
      prune: true
      selfHeal: true
