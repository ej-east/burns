apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-external-secret
  namespace: opensearch
spec:
  refreshInterval: 8h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opensearch-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: opensearch-admin
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: opensearch-admin
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
