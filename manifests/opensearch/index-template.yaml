apiVersion: opensearch.org/v1
kind: OpensearchIndexTemplate
metadata:
  name: logs-template
  namespace: opensearch
spec:
  opensearchCluster:
    name: burns
  name: logs-template
  indexPatterns:
    - "logs-*"
  priority: 100
  template:
    settings:
      number_of_shards: 1
      number_of_replicas: 1
      "index.plugins.index_state_management.rollover_alias": "logs"
    mappings:
      properties:
        "@timestamp": {type: date}
