apiVersion: opensearch.org/v1
kind: OpenSearchISMPolicy
metadata:
  name: logs-policy
  namespace: opensearch
spec:
  opensearchCluster:
    name: burns
  policyId: burns-log-policy
  description: "Rollover at 20gb or 1 day; Shrink replicate at 7 days, delete at 30d"
  defaultState: hot
  ismTemplate:
    indexPatterns:
      - "logs-*"
    priority: 100
  states:
    - name: hot
      actions:
        - rollover:
            minSize: "20gb"
            minIndexAge: "1d"
      transitions:
        - stateName: warm
          conditions:
            minIndexAge: "7d"
    - name: warm
      actions:
        - replicaCount:
            numberOfReplicas: 0
        - forceMerge:
            maxNumSegments: 1
      transitions:
        - stateName: delete
          conditions:
            minIndexAge: "30d"
    - name: delete
      actions:
        - delete: {}
      transitions: []
