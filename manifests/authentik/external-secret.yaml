apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-external-secret
  namespace: authentik
spec:
  refreshInterval: 8h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret_key
      remoteRef:
        key: authentik
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql_password
      remoteRef:
        key: authentik
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql_host
      remoteRef:
        key: authentik
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql_port
      remoteRef:
        key: authentik
        property: port
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql_username
      remoteRef:
        key: authentik
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql_name
      remoteRef:
        key: authentik
        property: name
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: username
      remoteRef:
        key: authentik
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: authentik
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
